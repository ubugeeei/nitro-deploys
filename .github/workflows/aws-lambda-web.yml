name: AWS Lambda Web

on:
  push:
    branches: [main, aws-lambda-web, "test/aws-lambda-web-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global --force corepack && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build:aws-lambda-web
      - run: pnpm test:aws-lambda-web
      - uses: actions/upload-artifact@v4
        with:
          name: aws-lambda-web-output
          path: .output/
          include-hidden-files: true
          retention-days: 7
